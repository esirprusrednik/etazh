services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - data:/data
    expose:
      - "3000"

  # Caddy сам получает и продлевает HTTPS-сертификат Let's Encrypt
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  data:
  caddy_data:
  caddy_config:
